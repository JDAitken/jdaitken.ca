<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thanks | JD Media</title>
  <meta name="description" content="Thanks — we'll be in touch soon.">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/x-icon" href="/brand/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon/apple-touch-icon.png">

  <link rel="stylesheet" href="/styles/tokens-v2.css">
  <link rel="stylesheet" href="/styles/base-v2.css">
  <link rel="stylesheet" href="/styles/components-v2.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    .site-header {
      position: sticky; top: 0; z-index: var(--z-sticky);
      background: var(--color-surface); border-bottom: 1px solid var(--color-border);
      height: var(--header-height-mobile); display: flex; align-items: center;
    }
    @media (min-width: 768px) { .site-header { height: var(--header-height); } }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; max-width: var(--container-xl); margin: 0 auto; padding: 0 var(--space-md);
    }
    @media (min-width: 768px) { .header-inner { padding: 0 var(--space-xl); } }

    .thanks-section {
      min-height: 60vh; display: flex; align-items: center;
      padding: var(--space-4xl) 0;
    }
    .thanks-content { max-width: 520px; }
    .thanks-content h1 { margin-bottom: var(--space-sm); }
    .thanks-content p { color: var(--color-text-secondary); font-size: var(--text-lg); margin-bottom: var(--space-xl); }
    .thanks-actions { display: flex; flex-direction: column; gap: var(--space-md); }
    @media (min-width: 768px) { .thanks-actions { flex-direction: row; } }

    .site-footer { border-top: 1px solid var(--color-border); padding: var(--space-2xl) 0; }
    .footer-bottom { font-size: var(--text-xs); color: var(--color-text-muted); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-sm); }
  </style>

  <!-- Tracking: GA4 + Google Ads + Meta Pixel, centralized in /js/tracking.js -->
  <script src="/js/tracking.js"></script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1285414636910501&ev=PageView&noscript=1"
  /></noscript>

  <!-- Lead conversion: fires only when a form set jd_lead in sessionStorage right before
       redirecting here (contact, audit modals, hi, lp). Prevents refreshes, direct hits, and
       back-button visits from inflating conversion counts / training Smart Bidding on noise. -->
  <script>
    (function () {
      var source = sessionStorage.getItem('jd_lead');
      if (source) {
        sessionStorage.removeItem('jd_lead');
        window.jdTrackLead(source);
      }
    })();
  </script>
</head>

<body>

<a href="#main" class="skip-link">Skip to content</a>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo-link">
      <img src="/images/logos/jd-media-logo.svg" alt="JD Media - Ottawa Web Design" class="logo-img">
    </a>
  </div>
</header>

<main id="main">
  <section class="thanks-section">
    <div class="container">
      <div class="thanks-content">
        <h1>Thanks — I'll reply soon.</h1>
        <p>I typically respond within 1 business day. Want to talk sooner? Book a 15-minute call and skip the wait.</p>
        <div class="thanks-actions">
          <a href="https://cal.com/jd-media/quick-fit" target="_blank" rel="noopener" class="btn btn-primary">Book a 15-Minute Call</a>
          <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
        <p style="margin-top: var(--space-lg); font-size: var(--text-sm);"><a href="mailto:jd@jdaitken.ca">Or email me directly</a></p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>&copy; 2026 JD Media. Websites that get you more calls. &middot; <a href="/privacy">Privacy Policy</a></p>
      <a href="https://greatworkguild.com/listings/jd-media" target="_blank" rel="noopener">
        <img src="https://greatworkguild.com/api/badges/c8027941-1e2a-4dce-9ee0-57e1d3871107/verified" alt="Featured Agency – Great Work Guild" width="80" height="69" loading="lazy" />
      </a>
    </div>
  </div>
</footer>

<script src="/js/main.js" defer></script>
</body>
</html>
