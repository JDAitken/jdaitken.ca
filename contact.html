<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | JD Media</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon/favicon-light.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon/favicon-16.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/chat.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="nav" data-nav>
  <div class="nav-inner">
    <div class="nav-main">
      <a class="logo" aria-label="Homepage" href="/">
        <img src="/brand/diamond-mark.svg" alt="JD Media logo">
        <span class="brand-text">JD Media</span>
      </a>
      <nav id="primary-navigation" aria-label="Main Navigation" class="nav-links" data-nav-links>
        <a href="/#work">Work</a>
        <a href="/#process">Process</a>
        <a href="/#pricing">Pricing</a>
      </nav>
    </div>
    <div class="nav-actions">
      <a href="/#contact" class="btn hero-cta nav-cta">Free Audit</a>
      <button type="button" class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="primary-navigation" data-nav-toggle>
        <span class="menu-icon" aria-hidden="true"><span></span></span>
      </button>
    </div>
  </div>
</header>

<main class="contact contact-page">
  <h1>Get Your Free Website Audit</h1>
  <p class="contact-lead">I'll review your site and show you exactly how to get more leads from your website—no obligation.</p>

  <div class="form-card">
    <form class="contact-form" action="https://formspree.io/f/xaqjbayd" method="POST" data-contact-form>
      <div class="form-grid">
        <label class="form-field">
          <span class="form-label">Name</span>
          <input class="form-input" type="text" name="name" autocomplete="name" required>
        </label>
        <label class="form-field">
          <span class="form-label">Business Name</span>
          <input class="form-input" type="text" name="business" autocomplete="organization" required>
        </label>
        <label class="form-field">
          <span class="form-label">Phone</span>
          <input class="form-input" type="tel" name="phone" autocomplete="tel" required>
        </label>
        <label class="form-field">
          <span class="form-label">Email</span>
          <input class="form-input" type="email" name="email" autocomplete="email" required>
        </label>
      </div>

      <label class="form-field">
        <span class="form-label">Current Website (optional)</span>
        <input class="form-input" type="url" name="website" placeholder="https://yourwebsite.com" autocomplete="url">
      </label>

      <label class="form-field">
        <span class="form-label">Message (optional)</span>
        <textarea class="form-textarea" name="message" rows="4" placeholder="What's your biggest challenge with your current website?"></textarea>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn">Get My Free Audit</button>
      </div>

      <div class="form-status" role="status" aria-live="polite" data-form-status></div>
    </form>
  </div>

  <p class="form-hint" style="margin-top: 24px; text-align: center;">I typically respond within 24-48 hours with your personalized audit.</p>
</main>

<div id="chat-widget-root" aria-live="polite"></div>
<footer>
  <p>© 2025 JD Media — Web Solutions for HVAC Businesses</p>
</footer>
<script src="js/main.js" defer></script>
<script src="js/chat.js" defer></script>
</body>
</html>
