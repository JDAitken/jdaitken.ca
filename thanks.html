<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thanks | JD Media</title>
  <meta name="description" content="Thanks — we'll be in touch soon.">

  <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon/favicon-2.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-2.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon/favicon-2.png">

  <link rel="stylesheet" href="/styles/tokens-v2.css">
  <link rel="stylesheet" href="/styles/base-v2.css">
  <link rel="stylesheet" href="/styles/components-v2.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    .site-header {
      position: sticky; top: 0; z-index: var(--z-sticky);
      background: var(--color-surface); border-bottom: 1px solid var(--color-border);
      height: var(--header-height-mobile); display: flex; align-items: center;
    }
    @media (min-width: 768px) { .site-header { height: var(--header-height); } }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; max-width: var(--container-xl); margin: 0 auto; padding: 0 var(--space-md);
    }
    @media (min-width: 768px) { .header-inner { padding: 0 var(--space-xl); } }

    .thanks-section {
      min-height: 60vh; display: flex; align-items: center;
      padding: var(--space-4xl) 0;
    }
    .thanks-content { max-width: 520px; }
    .thanks-content h1 { margin-bottom: var(--space-sm); }
    .thanks-content p { color: var(--color-text-secondary); font-size: var(--text-lg); margin-bottom: var(--space-xl); }
    .thanks-actions { display: flex; flex-direction: column; gap: var(--space-md); }
    @media (min-width: 768px) { .thanks-actions { flex-direction: row; } }

    .site-footer { border-top: 1px solid var(--color-border); padding: var(--space-2xl) 0; }
    .footer-bottom { font-size: var(--text-xs); color: var(--color-text-muted); }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9Q56QL24ES"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9Q56QL24ES');
  </script>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo-link">
      <img src="/images/logos/jd-media-logo.svg" alt="JD Media - Ottawa Web Design" class="logo-img">
    </a>
  </div>
</header>

<main>
  <section class="thanks-section">
    <div class="container">
      <div class="thanks-content">
        <h1>Thanks — I'll reply soon.</h1>
        <p>I typically respond within 1 business day. If your request is urgent, feel free to call or email directly.</p>
        <div class="thanks-actions">
          <a href="/" class="btn btn-primary">Back to Home</a>
          <a href="mailto:jd@jdaitken.ca" class="btn btn-secondary">Email Me Directly</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>&copy; 2026 JD Media &mdash; Web Solutions for Local Service Businesses</p>
    </div>
  </div>
</footer>

<script src="/js/main.js" defer></script>
</body>
</html>
